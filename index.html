<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#A3B565" />
  <meta name="description" content="Календарь с планами на день" />
  <title>Календарь</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=13" />
</head>
<body>
  <div class="delete-dropzone" id="deleteDropzone" hidden aria-hidden="true">
    <div class="delete-dropzone-inner">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 7h14"></path>
        <path d="M10 7V5h4v2"></path>
        <path d="M8 7l1 12h6l1-12"></path>
      </svg>
      <span>Перетащите сюда, чтобы удалить</span>
    </div>
  </div>

  <div class="app">
    <header class="app-header">
      <button type="button" class="nav-btn" id="prevMonth" aria-label="Предыдущий месяц">‹</button>
      <button type="button" class="month-title" id="monthTitle" aria-label="Развернуть календарь">
        <span id="monthLabel"></span>
        <span class="expand-hint" id="expandHint" hidden>Развернуть</span>
      </button>
      <button type="button" class="nav-btn" id="nextMonth" aria-label="Следующий месяц">›</button>
    </header>

    <section class="calendar-section" aria-label="Календарь">
      <div class="weekday-row" aria-hidden="true">
        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span>
        <span class="weekday-off">Сб</span><span class="weekday-off">Вс</span>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </section>

    <section class="tasks-section" id="tasksSection" hidden>
      <div class="tasks-header">
        <h2 class="tasks-date" id="tasksDateLabel"></h2>
        <div class="header-actions">
          <button type="button" class="gift-btn" id="addBirthdayBtn" aria-label="Добавить день рождения">
            <img src="assets/star.png" alt="" class="star-icon" width="24" height="24" />
          </button>
          <button type="button" class="add-btn" id="addTaskBtn" aria-label="Добавить задачу">+</button>
        </div>
      </div>

      <form class="add-form" id="addForm" hidden>
        <input
          type="text"
          id="addInput"
          class="add-input"
          placeholder="Текст задачи или пусто для линии"
          maxlength="500"
          autocomplete="off"
          enterkeyhint="go"
        />
        <button type="submit" class="add-submit">Разделитель</button>
      </form>

      <ul class="task-list" id="taskList" aria-live="polite"></ul>
      <p class="empty-hint" id="emptyHint">Пока нет записей. Нажмите + или ★, чтобы добавить.</p>
    </section>
  </div>

  <div class="confirm-overlay" id="confirmOverlay" hidden>
    <div class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h3 class="confirm-title" id="confirmTitle">Удалить задачу?</h3>
      <p class="confirm-text" id="confirmText"></p>
      <div class="confirm-actions">
        <button type="button" class="confirm-cancel" id="confirmCancel">Отмена</button>
        <button type="button" class="confirm-ok" id="confirmOk">Удалить</button>
      </div>
    </div>
  </div>

  <script src="js/storage.js?v=13"></script>
  <script src="js/calendar.js?v=13"></script>
  <script src="js/tasks.js?v=13"></script>
  <script src="js/app.js?v=13"></script>
</body>
</html>
